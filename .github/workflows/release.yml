name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: build & attach jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Test
        run: mvn -B -q test

      - name: Package
        run: mvn -B -q package -DskipTests

      # 自动创建/复用与 tag 同名的 GitHub Release 并挂上 jar
      - name: Attach jar to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/qsdb-jdbc-*.jar
          generate_release_notes: true
